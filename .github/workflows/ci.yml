name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run test:coverage

      # O build precisa das variáveis do Firebase apenas em runtime, mas o
      # client SDK é inicializado na importação — valores vazios bastam aqui.
      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ""
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ""
          NEXT_PUBLIC_FIREBASE_PORJECT_ID: ""
